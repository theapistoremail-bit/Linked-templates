<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Login Form</title>
    <style>
        /* Reseteo básico y tipografía */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000; /* Respaldo si el video tarda en cargar */
            overflow: hidden;
            position: relative;
        }

        /* Video de fondo a pantalla completa */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Contenedor con efecto Glassmorphism */
        .container {
            position: relative;
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.06); /* Ultra traslúcido */
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15); /* Borde sutil brillante */
            
            /* Efecto clave de Glassmorphism */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        form h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Campos de entrada flotantes e interactivos */
        .input-field {
            position: relative;
            margin: 25px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .input-field input {
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #fff;
            padding: 0 5px;
        }

        .input-field label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s ease;
        }

        /* Animación del label al enfocar o rellenar el input */
        .input-field input:focus ~ label,
        .input-field input:valid ~ label {
            top: -5px;
            font-size: 0.85rem;
            color: #00e5ff; /* Tono cian eléctrico complementario a los peces */
        }

        /* Opciones de "Recordar" y "Olvidé contraseña" */
        .forget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin: 15px 0 25px;
        }

        .forget label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .forget label input {
            margin-right: 8px;
            accent-color: #00e5ff;
        }

        .forget label p {
            margin: 0;
        }

        .forget a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forget a:hover {
            text-decoration: underline;
            color: #00e5ff;
        }

        /* Botón de inicio de sesión con transiciones suaves */
        button {
            width: 100%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #000;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        /* Enlace de creación de cuenta */
        .Create-account {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 25px;
        }

        .Create-account p {
            margin: 0;
        }

        .Create-account a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: 600;
        }

        .Create-account a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="PixVerse_V6_Image_Text_360P_Hola_crea_por_favo 2.mp4" type="video/mp4">
        Tu navegador no soporta videos como fondo.
    </video>

    <div class="container">
        <form action="#">
            <h2>Login-form</h2>
            
            <div class="input-field">
                <input type="text" required />
                <label>Enter email</label>
            </div>
            
            <div class="input-field">
                <input type="password" required />
                <label>Enter password</label>
            </div>
            
            <div class="forget">
                <label for="Save-login">
                    <input type="checkbox" id="Save-login" />
                    <p>Save login information</p>
                </label>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit">Log In</button>
            
            <div class="Create-account">
                <p>Don't have an account? <a href="#">Create account</a></p>
            </div>
        </form>
    </div>

</body>
</html>
